name: Error (bug)
description: Algo que no funciona como debería.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Entrar a …
        2. Hacer clic en …
        3. Ver el error
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: textarea
    id: real
    attributes:
      label: Qué pasó en realidad
      description: Pega el mensaje de error de la consola o una captura.
    validations:
      required: true
